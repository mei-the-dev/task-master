<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="700" height="60" fill="#f8f9fa" stroke="#ccc"/>
  <text x="30" y="40" font-family="Arial" font-size="24" fill="#333">Productivity Analytics</text>
  
  <!-- Analytics Content -->
  <rect x="30" y="80" width="640" height="380" fill="#fff" stroke="#ccc"/>
  <text x="50" y="120" font-family="Arial" font-size="16" fill="#333">[Charts: Completed Tasks, Overdue, Streak, Trends]</text>
  
  <!-- Chart Example -->
  <rect x="80" y="160" width="200" height="120" fill="#e9ecef" stroke="#007bff"/>
  <text x="100" y="200" font-family="Arial" font-size="14" fill="#007bff">Completed</text>
  <rect x="320" y="160" width="200" height="120" fill="#e9ecef" stroke="#dc3545"/>
  <text x="340" y="200" font-family="Arial" font-size="14" fill="#dc3545">Overdue</text>
  <rect x="200" y="320" width="200" height="80" fill="#e9ecef" stroke="#28a745"/>
  <text x="220" y="360" font-family="Arial" font-size="14" fill="#28a745">Streak</text>
</svg>
